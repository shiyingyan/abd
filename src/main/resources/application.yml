server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true

shiro:
  loginUrl: /login

spring:
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  aop:
    proxy-target-class: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/auto_deploy?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mvc:
    static-path-pattern: /static/**
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML5
    encoding: UTF-8
    cache: false
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false


mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# Application custom config
autodeploy:
  # System work directory
  work-dir: ${user.home}/.autodeploy
  logs-dir: ${autodeploy.work-dir}/logs
  builds-dir: ${autodeploy.work-dir}/builds
  data-dir: ${autodeploy.work-dir}/data
  # Build defaults
  max-concurrent: 20
  log-retention-days: 7
  history-retention-days: 90

logging:
  config: classpath:logback-spring.xml
  level:
    com.autodeploy: DEBUG
    org.apache.shiro: DEBUG
