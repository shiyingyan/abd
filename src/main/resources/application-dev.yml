server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  aop:
    proxy-target-class: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/auto_deploy?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
#  h2:
#    console:
#      enabled: true
#      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML5
    encoding: UTF-8
    cache: false
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

autodeploy:
  work-dir: ${user.home}/.autodeploy
  logs-dir: ${autodeploy.work-dir}/logs
  builds-dir: ${autodeploy.work-dir}/builds
  data-dir: ${autodeploy.work-dir}/data
  max-concurrent: 20
  log-retention-days: 7
  history-retention-days: 90

logging:
  level:
    com.autodeploy: DEBUG
    org.apache.shiro: INFO
