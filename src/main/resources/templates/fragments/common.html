<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Common head fragment -->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title th:text="${title != null ? title : 'Auto Deploy'}">Auto Deploy</title>
    <link rel="icon" href="data:,"/>
    <link rel="stylesheet" th:href="@{/static/vendor/bootstrap/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/static/vendor/bootstrap-icons/bootstrap-icons.css}"/>
    <link rel="stylesheet" th:href="@{/static/css/app.css}"/>
</head>

<body>
<!-- Navigation bar fragment -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/"><i class="bi bi-rocket-takeoff me-2"></i>Auto Deploy</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/build}"><i class="bi bi-hammer me-1"></i>构建管理</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/history}"><i class="bi bi-clock-history me-1"></i>构建历史</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/config}"><i class="bi bi-gear me-1"></i>项目配置</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/server}"><i class="bi bi-server me-1"></i>服务器维护</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/environment}"><i class="bi bi-layers me-1"></i>部署环境</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/runtime}"><i class="bi bi-code-slash me-1"></i>语言环境</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/settings}"><i class="bi bi-sliders me-1"></i>系统设置</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-1"></i>退出登录</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Sidebar fragment -->
<div th:fragment="sidebar" class="col-md-2 d-none d-md-block sidebar">
    <div class="list-group list-group-flush">
        <a class="list-group-item list-group-item-action" th:href="@{/build}"><i class="bi bi-hammer me-2"></i>构建管理</a>
        <a class="list-group-item list-group-item-action" th:href="@{/history}"><i class="bi bi-clock-history me-2"></i>构建历史</a>
        <a class="list-group-item list-group-item-action" th:href="@{/config}"><i class="bi bi-gear me-2"></i>项目配置</a>
        <a class="list-group-item list-group-item-action" th:href="@{/server}"><i class="bi bi-server me-2"></i>服务器维护</a>
        <a class="list-group-item list-group-item-action" th:href="@{/environment}"><i class="bi bi-layers me-2"></i>部署环境</a>
        <a class="list-group-item list-group-item-action" th:href="@{/runtime}"><i class="bi bi-code-slash me-2"></i>语言环境</a>
        <a class="list-group-item list-group-item-action" th:href="@{/settings}"><i class="bi bi-sliders me-2"></i>系统设置</a>
    </div>
</div>

<!-- Common scripts fragment -->
<th:block th:fragment="scripts">
    <script th:src="@{/static/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/static/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/static/js/app.js}"></script>
</th:block>
</body>
</html>
