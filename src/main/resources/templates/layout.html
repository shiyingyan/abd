<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title th:text="${pageTitle != null ? pageTitle : 'Auto Deploy'}">Auto Deploy</title>
    <link rel="icon" href="data:,"/>
    <link rel="stylesheet" th:href="@{/static/vendor/bootstrap/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/static/vendor/bootstrap-icons/bootstrap-icons.css}"/>
    <link rel="stylesheet" th:href="@{/static/css/app.css}"/>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Auto Deploy</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/config}">项目配置</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/server}">服务器维护</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/environment}">部署环境</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/build}">构建管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/history}">构建历史</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/settings}">系统设置</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/runtime}">语言环境</a>
                    </li>
                </ul>
                <ul class="navbar-nav" th:if="${sessionUser != null}">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            <span th:text="${sessionUser}">User</span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/logout}">退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <div class="row">
            <div class="col-md-2 d-none d-md-block bg-light sidebar">
                <div class="list-group list-group-flush">
                    <a class="list-group-item list-group-item-action" th:href="@{/config}">项目配置</a>
                    <a class="list-group-item list-group-item-action" th:href="@{/server}">服务器维护</a>
                    <a class="list-group-item list-group-item-action" th:href="@{/environment}">部署环境</a>
                    <a class="list-group-item list-group-item-action" th:href="@{/build}">构建管理</a>
                    <a class="list-group-item list-group-item-action" th:href="@{/history}">构建历史</a>
                    <a class="list-group-item list-group-item-action" th:href="@{/settings}">系统设置</a>
                    <a class="list-group-item list-group-item-action" th:href="@{/runtime}">语言环境</a>
                </div>
            </div>
            <div class="col-md-10">
                <div th:fragment="content">
                    <!-- Page content goes here -->
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/static/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/static/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/static/js/app.js}"></script>
</body>
</html>
