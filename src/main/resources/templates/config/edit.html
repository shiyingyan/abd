<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/common :: head('编辑配置 - Auto Deploy')"></head>
<body>
<nav th:replace="fragments/common :: navbar"></nav>
<div class="container-fluid mt-3">
    <div class="row">
        <div th:replace="fragments/common :: sidebar"></div>
        <div class="col-md-10">
            <h4 th:text="${isNew} ? '新建项目配置' : '编辑项目配置'">编辑配置</h4>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <form th:action="@{/config/save}" th:object="${config}" method="post" id="configForm">
                <input type="hidden" th:field="*{id}"/>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">项目名称 *</label>
                        <input type="text" class="form-control" th:field="*{projectName}" required/>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">版本号 *</label>
                        <input type="text" class="form-control" th:field="*{version}" required/>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">代码分支</label>
                        <input type="text" class="form-control" th:field="*{gitBranch}" value="main"/>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Git 仓库地址 *</label>
                    <input type="text" class="form-control" th:field="*{gitRepoUrl}" required
                           placeholder="https://github.com/user/repo.git"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Git 认证环境变量名</label>
                    <input type="text" class="form-control" th:field="*{gitAuthEnvKey}"
                           placeholder="如 GIT_TOKEN，系统从环境变量读取实际值"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">项目目录</label>
                    <input type="text" class="form-control" th:field="*{projectDir}"
                           placeholder="留空使用默认临时目录"/>
                    <div class="form-text">
                        指定项目代码的存放目录。留空时，系统为每个用户自动分配独立的临时目录（同一用户目录保持不变）；指定后，所有用户共用该目录。
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label class="form-label">构建指令 *</label>
                        <input type="text" class="form-control" th:field="*{buildCommand}" required
                               placeholder="如 mvn clean package -DskipTests"/>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">构建工作目录
                            <i class="bi bi-question-circle ad-help-icon" data-bs-toggle="tooltip" data-bs-placement="right"
                               title="相对于项目根目录的路径，例如 src/main。留空则使用项目根目录。"></i>
                        </label>
                        <input type="text" class="form-control" th:field="*{buildWorkDir}"
                               placeholder="如 src/main"/>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">语言类型 <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{languageType}">
                            <option value="">--</option>
                            <option value="JAVA">Java</option>
                            <option value="GO">Go</option>
                            <option value="NODE">Node</option>
                            <option value="PYTHON">Python</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">语言版本 <span class="text-danger">*</span></label>
                        <select class="form-select" id="languageVersionSelect" name="languageVersion">
                            <option value="">请先选择语言类型</option>
                        </select>
                        <div id="noVersionsMsg" class="form-text text-warning d-none">
                            未安装任何版本。<a th:href="@{/runtime}">前往语言环境管理</a> 安装版本。
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">自定义安装目录</label>
                        <input type="text" class="form-control" th:field="*{customInstallDir}"
                               placeholder="可选，留空使用默认路径"/>
                    </div>
                </div>
                <hr/>
                <h6>部署配置</h6>
                <div class="mb-3">
                    <label class="form-label">部署目标路径</label>
                    <input type="text" class="form-control" th:field="*{deployTargetPath}"
                           placeholder="/opt/apps/myapp/"/>
                    <div class="form-text">
                        留空时使用服务器默认路径。指定后，所有关联服务器都使用此路径。
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">构建产物路径</label>
                    <input type="text" class="form-control" th:field="*{deploySourcePath}"
                           placeholder="相对于项目根目录，如 target、dist"/>
                    <div class="form-text">
                        指定构建后需要部署的产物目录（相对于项目根目录）。留空时系统根据语言类型自动推断：Java 取 target 目录下的 jar 文件，Node 取 dist 目录，Go 取项目根目录下的可执行文件，Python 取项目根目录。
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">启动命令
                            <small class="text-muted">（可选）</small>
                        </label>
                        <input type="text" class="form-control" th:field="*{startCommand}"
                               placeholder="留空表示不需要启动"/>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">重启命令
                            <small class="text-muted">（可选）</small>
                        </label>
                        <input type="text" class="form-control" th:field="*{restartCommand}"
                               placeholder="留空表示不需要重启"/>
                    </div>
                </div>

                <!-- Environment-Server Association -->
                <div class="mb-3">
                    <hr/>
                    <h6>项目环境与服务器配置</h6>
                    <div th:if="${isNew}" class="alert alert-info">
                        <i class="bi bi-info-circle me-1"></i>
                        请先保存项目配置，然后在此处添加部署环境和服务器。
                    </div>
                    <div th:if="${!isNew}" class="card mb-3">
                        <div class="card-body">
                            <div class="row g-2 align-items-end mb-3">
                                <div class="col-md-3">
                                    <label class="form-label">选择环境</label>
                                    <select class="form-select" id="pesEnvSelect">
                                        <option value="">-- 请选择 --</option>
                                        <option th:each="env : ${environments}" th:value="${env.id}" th:text="${env.name}"></option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">选择服务器</label>
                                    <select class="form-select" id="pesServerSelect">
                                        <option value="">请先选择环境</option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <button type="button" class="btn btn-outline-primary btn-sm" id="addPesBtn">
                                        <i class="bi bi-plus-circle me-1"></i>添加
                                    </button>
                                </div>
                            </div>
                            <table class="table table-sm mb-0" id="pesTable">
                                <thead>
                                    <tr><th>环境</th><th>服务器</th><th>地址</th><th>部署</th><th>操作</th></tr>
                                </thead>
                                <tbody>
                                    <tr th:each="pes : ${projectEnvServers}" th:data-id="${pes.id}">
                                        <td><span class="badge bg-info" th:text="${pes.environmentName}"></span></td>
                                        <td th:text="${pes.serverName}"></td>
                                        <td><code th:text="${pes.serverHost}"></code></td>
                                        <td>
                                            <div class="form-check form-switch mb-0">
                                                <input class="form-check-input toggle-deploy-switch" type="checkbox"
                                                       th:data-id="${pes.id}"
                                                       th:checked="${pes.deployEnabled == null || pes.deployEnabled}"/>
                                            </div>
                                        </td>
                                        <td>
                                            <button type="button" class="btn btn-sm btn-outline-danger remove-pes-btn" th:data-id="${pes.id}">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a th:href="@{/config}" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>
<th:block th:replace="fragments/common :: scripts"></th:block>
<script th:inline="javascript">
    var currentLanguageVersion = /*[[${config.languageVersion}]]*/ '';

    function loadVersions(langType) {
        var select = document.getElementById('languageVersionSelect');
        var noVersionsMsg = document.getElementById('noVersionsMsg');
        noVersionsMsg.classList.add('d-none');

        if (!langType) {
            select.innerHTML = '<option value="">请先选择语言类型</option>';
            return;
        }

        // Show saved version immediately while loading
        if (currentLanguageVersion) {
            select.innerHTML = '<option value="' + currentLanguageVersion + '">' + currentLanguageVersion + ' (加载中...)</option>';
        } else {
            select.innerHTML = '<option value="">加载中...</option>';
        }

        $.get('/api/runtime/versions', {language: langType}, function(versions) {
            select.innerHTML = '';
            if (!versions || versions.length === 0) {
                // Keep saved version even if no versions found from system
                if (currentLanguageVersion) {
                    select.innerHTML = '<option value="' + currentLanguageVersion + '">' + currentLanguageVersion + '</option>';
                } else {
                    select.innerHTML = '<option value="">无可用版本</option>';
                }
                noVersionsMsg.classList.remove('d-none');
                return;
            }
            select.innerHTML = '<option value="">-- 选择版本 --</option>';
            versions.forEach(function(v) {
                var opt = document.createElement('option');
                opt.value = v;
                opt.textContent = v;
                if (currentLanguageVersion && v.trim() === currentLanguageVersion.trim()) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });
        }).fail(function() {
            // Keep saved version on load failure
            if (currentLanguageVersion) {
                select.innerHTML = '<option value="' + currentLanguageVersion + '">' + currentLanguageVersion + '</option>';
            } else {
                select.innerHTML = '<option value="">加载失败</option>';
            }
        });
    }

    $(document).ready(function() {
        var langSelect = document.querySelector('[name="languageType"]');
        langSelect.addEventListener('change', function() {
            // Reset saved version when user changes language type
            currentLanguageVersion = '';
            loadVersions(this.value);
        });
        // Load versions on page load if language type is already selected
        if (langSelect.value) {
            loadVersions(langSelect.value);
        }

        // Form validation: language version required when language type is selected
        $('#configForm').on('submit', function(e) {
            var langType = $('[name="languageType"]').val();
            var langVersion = $('[name="languageVersion"]').val();
            if (langType && !langVersion) {
                e.preventDefault();
                alert('已选择语言类型 ' + langType + '，请选择对应的语言版本');
                $('[name="languageVersion"]').focus();
                return false;
            }
        });
    });

    // ===== Project-Environment-Server Association =====
    var configId = /*[[${config.id}]]*/ null;

    $('#pesEnvSelect').change(function() {
        var envId = $(this).val();
        var serverSelect = $('#pesServerSelect');
        if (!envId) {
            serverSelect.html('<option value="">请先选择环境</option>');
            return;
        }
        serverSelect.html('<option value="">加载中...</option>');
        $.get('/api/servers/by-environment/' + envId, function(servers) {
            serverSelect.html('<option value="">-- 请选择服务器 --</option>');
            servers.forEach(function(s) {
                serverSelect.append('<option value="' + s.id + '">' + s.name + ' (' + s.host + ')</option>');
            });
        }).fail(function() {
            serverSelect.html('<option value="">加载失败</option>');
        });
    });

    $('#addPesBtn').click(function() {
        var envId = $('#pesEnvSelect').val();
        var serverId = $('#pesServerSelect').val();
        if (!envId || !serverId) {
            alert('请选择环境和服务器');
            return;
        }
        var btn = $(this);
        btn.prop('disabled', true);
        $.post('/api/config/' + configId + '/env-servers', {
            environmentId: envId, serverId: serverId
        }, function() {
            location.reload();
        }).fail(function() {
            alert('添加失败');
            btn.prop('disabled', false);
        });
    });

    $('.remove-pes-btn').click(function() {
        var id = $(this).data('id');
        if (!confirm('确认移除此服务器关联？')) return;
        var btn = $(this);
        btn.prop('disabled', true);
        $.ajax({
            url: '/api/config/env-servers/' + id,
            type: 'DELETE',
            success: function() { location.reload(); },
            error: function() { alert('移除失败'); btn.prop('disabled', false); }
        });
    });

    $('.toggle-deploy-switch').change(function() {
        var id = $(this).data('id');
        var enabled = $(this).prop('checked');
        var sw = $(this);
        $.ajax({
            url: '/api/config/env-servers/' + id + '/toggle-deploy',
            type: 'PATCH',
            data: { enabled: enabled },
            error: function() {
                alert('更新失败');
                sw.prop('checked', !enabled);
            }
        });
    });
</script>
</body>
</html>
